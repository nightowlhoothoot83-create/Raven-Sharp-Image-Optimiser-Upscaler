name: Hotfix Image Optimiser core regressions

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hotfix-imageopt-core-20260815.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch core processing regressions
        shell: python
        run: |
          from pathlib import Path

          # 1) Runware current API schema: image belongs under inputs.image.
          p = Path('backend/server.py')
          s = p.read_text()
          old = '"inputImage": data_uri,'
          count = s.count(old)
          if count < 2:
              raise SystemExit(f'Expected at least 2 Runware inputImage occurrences, found {count}')
          s = s.replace(old, '"inputs": {"image": data_uri},')
          p.write_text(s)

          # 2) Allow the blob: dynamic module used by browser background-removal.
          p = Path('public/_headers')
          s = p.read_text()
          old = "script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval';"
          new = "script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:;"
          if old not in s and new not in s:
              raise SystemExit('Could not find CSP script-src marker')
          s = s.replace(old, new)
          p.write_text(s)

          # 3) Frontend: signed-in users use the stable Railway/Runware background-removal endpoint.
          #    Anonymous/basic use can still fall back to local browser processing.
          p = Path('src/pages/Optimiser.jsx')
          s = p.read_text()

          process_marker = '  // ── Process ───────────────────────────────────────────────────────────────\n'
          if 'const runCloudBackgroundRemoval = async (file) =>' not in s:
              helper = '''  const runCloudBackgroundRemoval = async (file) => {\n    if (!user) throw new Error("Sign in to use cloud background removal");\n    const dataURL = await readFileAsDataURL(file);\n    const b64 = dataURL.split(",")[1];\n    const mime = file.type || "image/png";\n    const { data } = await api.post("/remove-background", { image_base64: b64, mime });\n    const resultURL = `data:${data.mime || "image/png"};base64,${data.base64}`;\n    const blob = await (await fetch(resultURL)).blob();\n    return new File([blob], file.name.replace(/\\.[^.]+$/, "") + "-bg-removed.png", { type: data.mime || "image/png" });\n  };\n\n'''
              if process_marker not in s:
                  raise SystemExit('Could not find Process marker')
              s = s.replace(process_marker, helper + process_marker, 1)

          upscale_marker = '''        if (settings.upscale && REPLICATE_UPSCALE_ENABLED) {\n'''
          if 'Removing background with secure cloud processor' not in s:
              cloud_block = '''        // Prefer the backend for signed-in users. This avoids fragile mobile WASM/session\n        // initialisation while preserving the local-only path for anonymous/basic use.\n        if (img.removeBg && user) {\n          setProgress({ current: i + 1, total: images.length, msg: `Removing background with secure cloud processor…` });\n          try {\n            source = await runCloudBackgroundRemoval(img.file);\n            mergedSettings.removeBg = false; // do not run the browser remover a second time\n            mergedSettings.format = "png";   // preserve transparency\n          } catch (err) {\n            console.error(`Cloud background removal failed for ${img.name}:`, err);\n            throw new Error(`Background removal failed: ${err?.response?.data?.detail || err.message}`);\n          }\n        }\n\n'''
              if upscale_marker not in s:
                  raise SystemExit('Could not find upscale block marker')
              s = s.replace(upscale_marker, cloud_block + upscale_marker, 1)

          # Failed processing must retain the original source/preview, never replace it with blank output.
          old_fail = 'out.push({ error: msg, errorId: err.errorId || null, originalName: img.name, id: img.id });'
          new_fail = 'out.push({ error: msg, errorId: err.errorId || null, originalName: img.name, id: img.id, originalURL: img.preview, outputURL: img.preview, preservedOriginal: true });'
          if old_fail in s:
              s = s.replace(old_fail, new_fail, 1)

          # Show a large original preview immediately after upload, before any processing is run.
          preview_marker = '            {/* Anonymous signup nudge — shown once after first successful result */}'
          if 'data-testid="upload-original-preview"' not in s:
              preview_block = '''            {images.length > 0 && results.length === 0 && currentImage && (\n              <div data-testid="upload-original-preview" className="glass rounded-2xl p-4">\n                <div className="flex items-center justify-between mb-3">\n                  <span className="text-sm font-semibold">Preview</span>\n                  <span className="text-xs text-[var(--muted)] truncate max-w-[65%]">{currentImage.name}</span>\n                </div>\n                <div className="rounded-xl overflow-hidden bg-black/30 min-h-[220px] flex items-center justify-center">\n                  <img src={currentImage.preview} alt={`Preview of ${currentImage.name}`} className="max-w-full max-h-[560px] object-contain" />\n                </div>\n              </div>\n            )}\n\n'''
              if preview_marker not in s:
                  raise SystemExit('Could not find preview insertion marker')
              s = s.replace(preview_marker, preview_block + preview_marker, 1)

          # Make the background-removal description truthful for signed-in users.
          old_desc = 'Runs locally in your browser after a one-time model download'
          new_desc = '{user ? "Uses the secure cloud processor for reliable mobile results" : "Runs locally in your browser after a one-time model download"}'
          if old_desc in s:
              s = s.replace(old_desc, new_desc, 1)

          p.write_text(s)

      - name: Sanity checks
        shell: bash
        run: |
          python -m py_compile backend/server.py
          grep -q '"inputs": {"image": data_uri}' backend/server.py
          grep -q "script-src.*blob:" public/_headers
          grep -q 'runCloudBackgroundRemoval' src/pages/Optimiser.jsx
          grep -q 'upload-original-preview' src/pages/Optimiser.jsx
          grep -q 'preservedOriginal: true' src/pages/Optimiser.jsx
          npm ci
          CI=false npm run build

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "Raven Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/server.py public/_headers src/pages/Optimiser.jsx
          if git diff --cached --quiet; then
            echo "No repair changes needed"
            exit 0
          fi
          git commit -m "Fix Image Optimiser preview, background removal and upscale regressions"
          git push origin main
