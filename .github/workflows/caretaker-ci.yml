name: SaaS Caretaker CI

on:
  pull_request:
  push:
    branches:
      - feature/saas-caretaker-foundation-20260731
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CI: 'false'

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Validate care contract
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'version:', 'production_url:', 'critical_flows:',
              'protected_areas:', 'repair_policy:'
          ]
          text = Path('caretaker.yml').read_text(encoding='utf-8')
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'caretaker.yml missing: {missing}')
          print('caretaker.yml structure present')
          PY

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
